<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Noreste Grill – Mesero</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/hostess.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="sidebar__logo">
                <span class="logo-icon"></span>
                <span class="logo-text">Noreste Grill</span>
            </div>

            <nav class="sidebar__nav">
                <a href="/estado_mesas" class="nav-item">
                    <span class="nav-icon">🪑</span>
                    <span class="nav-label">Estado de mesas</span>
                </a>

                <a href="/promociones_vigentes" class="nav-item">
                    <span class="nav-icon">⭐</span>
                    <span class="nav-label">Promociones vigentes</span>
                </a>

                <a href="/rendimiento_mesero" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Mi rendimiento</span>
                </a>
            </nav>

            <div class="sidebar__footer">
                <button id="btnLogout" class="btn-ghost">🔐 Cerrar sesión</button>
            </div>
        </aside>

        <div class="main">

            <header class="topbar">
                <div class="topbar__left">
                    <h1 class="topbar__title">Panel del Mesero</h1>
                </div>

                <div class="topbar__right">
                    <div class="user-chip">
                        <div class="user-avatar">M</div>
                        <div class="user-info">
                            <span class="user-name" id="dashboardUserName">Usuario</span>
                           <span class="user-role" id="meseroTurnoAsignado">Turno asignado</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="content">

                <section class="cards-grid">

                    <article class="card">
                        <div class="card-header">
                            <span class="card-title">Mesas atendidas</span>
                            <span class="card-tag">🍽</span>
                        </div>
                        <div class="card-main">
                            <span class="card-number" id="cardMesasAtendidas">0</span>
                            <span class="card-caption">Registradas hoy</span>
                        </div>
                    </article>

                    <article class="card">
                        <div class="card-header">
                            <span class="card-title">Promedio de servicio</span>
                            <span class="card-tag">⏱</span>
                        </div>
                        <div class="card-main">
                            <span class="card-number" id="cardPromedioServicio">0 min</span>
                            <span class="card-caption">Por mesa atendida</span>
                        </div>
                    </article>

                    <article class="card">
                        <div class="card-header">
                            <span class="card-title">Promociones aplicadas</span>
                            <span class="card-tag">⭐</span>
                        </div>
                        <div class="card-main">
                            <span class="card-number" id="cardPromos">0</span>
                            <span class="card-caption">Durante el turno</span>
                        </div>
                    </article>

                </section>

                <section class="panel">
                    <header class="panel-header">
                        <h2 class="panel-title">Mis mesas actuales</h2>
                        <p class="panel-subtitle">Mesas asignadas actualmente</p>
                    </header>

                    <div class="panel-body panel-body--list" id="listaMesasMesero"></div>
                </section>

            </main>

        </div>
    </div>

    <script src="{{ url_for('static', filename='JS/dashboard_mesero.js') }}"></script>

    <script>
        document.getElementById("btnLogout").addEventListener("click", () => {
            localStorage.removeItem("ROL");
            localStorage.removeItem("USER");
            localStorage.removeItem("NO_EMPLEADO");
            window.location.href = "/";
        });

        const dashboardUserName = document.getElementById("dashboardUserName");
const user = localStorage.getItem("USER");

if (dashboardUserName) {
    dashboardUserName.textContent = user || "Usuario";
}
    </script>
</body>

</html>

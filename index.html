<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      line-height: 1.6;
      color: #333;
    }

    header {
      background: #333;
      color: #fff;
      padding: 1rem 2rem;
    }

    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #f4f4f4;
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Page</h1>
  </header>

  <main>
    <h2>Hello, World!</h2>
    <p>Start building your page here.</p>
  </main>

  <footer>
    <p>&copy; 2026</p>
  </footer>

</body>
</html>
